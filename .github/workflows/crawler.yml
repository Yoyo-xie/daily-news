name: Daily News Update

# 触发条件：
#   - 每天北京时间早上 7:00（UTC 23:00 前一天）
#   - 推送到 master/main 分支时（初次推送即跑）
#   - 手动触发（在 Actions 页面点 "Run workflow"）
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run crawler
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Prepare site
        run: |
          mkdir -p site
          if [ -f output/html/latest/current.html ]; then
            cp output/html/latest/current.html site/index.html
          else
            # 兜底：找最新生成的 html
            LATEST=$(find output/html -name "*.html" -type f -printf "%T@ %p\n" | sort -rn | head -1 | cut -d' ' -f2-)
            [ -n "$LATEST" ] && cp "$LATEST" site/index.html || echo "<h1>暂无数据</h1>" > site/index.html
          fi
          # 加一个简单的 404
          cp site/index.html site/404.html
          # 拷贝静态资源（favicon 等）到 site 根
          if [ -d static ]; then
            cp -r static/. site/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
